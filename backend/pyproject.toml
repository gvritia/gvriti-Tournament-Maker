[project]
name = "tournament-maker-backend"
version = "0.1.0"
description = "Backend for football championship and cup tournament management."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.1",
    "email-validator>=2.1.0",
    "fastapi>=0.111.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.1.18",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "python-jose[cryptography]>=3.3.0",
    "SQLAlchemy>=2.0.30",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.4.0",
    "httpx>=0.27.0",
    "pytest>=8.2.0",
    "ruff>=0.4.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
