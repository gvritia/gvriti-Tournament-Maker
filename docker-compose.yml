services:
  db:
    image: postgres:16-alpine
    container_name: tournament_maker_db
    environment:
      POSTGRES_DB: tournament_maker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tournament_maker"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: tournament_maker_backend
    environment:
      APP_NAME: Tournament Maker Backend
      ENVIRONMENT: local
      DEBUG: "true"
      API_V1_PREFIX: /api/v1
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
      SECRET_KEY: change-this-secret-key-before-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: tournament_maker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/tournament_maker
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
