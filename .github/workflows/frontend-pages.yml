name: Deploy frontend preview to GitHub Pages

# Builds the Vite SPA from `frontend/` and publishes it to GitHub Pages.
# The deployed site is a public read-only preview: it has no backend
# attached. Workspace/login flows display a notice telling visitors to run
# the project locally.
#
# After the first successful run, enable Pages in the repository:
#   Settings → Pages → Build and deployment → Source: GitHub Actions.

on:
  push:
    branches: [master, main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build for GitHub Pages
        env:
          # Vite uses these envs at build time. The repository name comes
          # from the runner so the base path is always correct, even if the
          # repo is later renamed.
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run build:pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
